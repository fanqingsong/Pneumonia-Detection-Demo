services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pneumonia-detection-demo:cpu
    restart: unless-stopped
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HOME: /root/.cache/huggingface
      HF_HUB_DOWNLOAD_TIMEOUT: "180"
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HUB_DISABLE_XET: "1"
      BENTOML_HOME: /root/bentoml
      BENTOML_CONFIG: /app/config/docker.yaml
      CUDA_VISIBLE_DEVICES: ""
      NVIDIA_VISIBLE_DEVICES: "void"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - bentoml-store:/root/bentoml
      - ./config/docker.yaml:/app/config/docker.yaml:ro
      - ./service.py:/app/service.py:ro
      - ./save_model.py:/app/save_model.py:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 300s

  web:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  hf-cache:
  bentoml-store:
